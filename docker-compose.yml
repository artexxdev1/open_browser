services:
  automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playwright-automation
    env_file:
      - .env
    environment:
      HEADLESS: "true"
    volumes:
      - ./app:/app/app:ro
      - automation-storage:/app/storage
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  automation-storage:
    driver: local
