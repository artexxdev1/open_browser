services:
  gapgpt-api:
    image: gapgpt-api:latest
    env_file:
      - .env
    environment:
      HEADLESS: "true"
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - automation-storage:/app/storage
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.gapGPT_api.rule=Host(`gapgpt-api.artan8n.ir`)
        - traefik.http.routers.gapGPT_api.entrypoints=websecure
        - traefik.http.routers.gapGPT_api.tls=true
        - traefik.http.routers.gapGPT_api.tls.certresolver=le
        - traefik.http.services.gapGPT_api.loadbalancer.server.port=8000
    stop_grace_period: 60s
    init: true

networks:
  traefik-public:
    external: true

volumes:
  automation-storage:
    driver: local
